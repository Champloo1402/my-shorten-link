<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Statistics</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: #13131a;
            --border: #1e1e2e;
            --accent: #00ff9d;
            --accent-dim: rgba(0, 255, 157, 0.08);
            --text: #e0e0e0;
            --muted: #555570;
            --danger: #ff4d6d;
            --danger-dim: rgba(255, 77, 109, 0.1);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            padding: 2rem;
            background-image:
                    radial-gradient(ellipse at 10% 20%, rgba(0,255,157,0.04) 0%, transparent 50%),
                    radial-gradient(ellipse at 90% 80%, rgba(100,80,255,0.04) 0%, transparent 50%);
        }

        .page-header {
            margin-bottom: 2.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: baseline;
            gap: 1rem;
        }

        .page-header h1 {
            font-family: 'Space Mono', monospace;
            font-size: 1.6rem;
            color: var(--accent);
            letter-spacing: -0.5px;
        }

        .page-header span {
            font-size: 0.85rem;
            color: var(--muted);
            font-family: 'Space Mono', monospace;
        }

        .stats-table-wrapper {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead tr {
            background: rgba(0,255,157,0.05);
            border-bottom: 1px solid var(--border);
        }

        th {
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 1rem 1.5rem;
            text-align: left;
            font-weight: 400;
        }

        td {
            padding: 1rem 1.5rem;
            font-size: 0.9rem;
            color: var(--text);
            border-bottom: 1px solid var(--border);
            vertical-align: middle;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        tbody tr {
            transition: background 0.15s ease;
        }

        tbody tr:hover {
            background: var(--accent-dim);
        }

        .url-cell {
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: #8888aa;
            max-width: 380px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .count-badge {
            display: inline-block;
            background: var(--accent-dim);
            color: var(--accent);
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            padding: 0.2rem 0.6rem;
            border-radius: 4px;
            border: 1px solid rgba(0,255,157,0.15);
        }

        .date-cell {
            font-size: 0.82rem;
            color: var(--muted);
            font-family: 'Space Mono', monospace;
        }

        .btn-delete {
            background: var(--danger-dim);
            color: var(--danger);
            border: 1px solid rgba(255,77,109,0.2);
            border-radius: 6px;
            padding: 0.3rem 0.8rem;
            font-size: 0.8rem;
            font-family: 'Space Mono', monospace;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-delete:hover {
            background: rgba(255,77,109,0.2);
            border-color: rgba(255,77,109,0.4);
            transform: translateY(-1px);
        }

        .btn-delete:active {
            transform: translateY(0);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--muted);
            font-family: 'Space Mono', monospace;
            font-size: 0.85rem;
        }

        .toast-container {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 9999;
        }

        .toast-msg {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.75rem 1.2rem;
            font-size: 0.85rem;
            font-family: 'Space Mono', monospace;
            margin-top: 0.5rem;
            animation: slideIn 0.2s ease;
        }

        .toast-msg.error { border-color: var(--danger); color: var(--danger); }
        .toast-msg.success { border-color: var(--accent); color: var(--accent); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .id-cell {
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: var(--muted);
        }
    </style>
</head>
<body>

<div class="page-header">
    <h1>// url statistics</h1>
    <span th:text="'(' + ${#lists.size(stats)} + ' records)'"></span>
</div>

<div class="stats-table-wrapper">
    <div th:if="${#lists.isEmpty(stats)}" class="empty-state">
        no records found.
    </div>

    <table th:if="${!#lists.isEmpty(stats)}">
        <thead>
        <tr>
            <th>ID</th>
            <th>Original URL</th>
            <th>Visits</th>
            <th>Last Access</th>
            <th>Action</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="stat : ${stats}" th:id="'row-' + ${stat.id}">
            <td class="id-cell" th:text="${stat.id}"></td>
            <td class="url-cell" th:text="${stat.url}" th:title="${stat.url}"></td>
            <td><span class="count-badge" th:text="${stat.count}"></span></td>
            <td class="date-cell" th:text="${#dates.format(stat.lastAccess, 'yyyy-MM-dd HH:mm')}"></td>
            <td>
                <button class="btn-delete"
                        th:attr="onclick='deleteUrl(' + ${stat.id} + ')'">
                    delete
                </button>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<a href="/" class="nav-link">← go back</a>

<div class="toast-container" id="toastContainer"></div>

<script>
    function deleteUrl(id) {
        fetch('/my/' + id, { method: 'DELETE' })
            .then(response => {
                if (response.ok) {
                    const row = document.getElementById('row-' + id);
                    if (row) row.remove();
                    showToast('URL deleted successfully', 'success');
                } else {
                    showToast('Failed to delete URL', 'error');
                }
            })
            .catch(() => showToast('Network error', 'error'));
    }

    function showToast(message, type) {
        const container = document.getElementById('toastContainer');
        const toast = document.createElement('div');
        toast.className = 'toast-msg ' + type;
        toast.textContent = message;
        container.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
</script>

</body>
</html>
